name: Run Sim

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libhdf5-dev \
            libboost-all-dev \
            libcgal-dev \
            libtinyxml-dev \
            qtbase5-dev \
            libvtk9-dev \
            libvtk9-qt-dev \
            gengetopt \
            help2man \
            groff \
            pod2pdf \
            bison \
            flex \
            libhpdf-dev \
            libtool

      - name: Setup Virtual Environment
        run: ./setup_venv.sh

      - name: Source Virtual Environment
        run: source ./venv/bin/activate

      - name: Show build log
        if: always()
        run: cat sub/openEMS-Project/build_*.log

      - name: Run simulation
        working-directory: sim
        run: |
          source ../venv/bin/activate
          python3 ./pcb_large_sim.py

      - name: Upload simulation plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-plots
          path: sim/results/*.png
          if-no-files-found: warn

      - name: Upload E-field VTR dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-field-dumps
          path: sim/pcb_large_sim/*.vtr
          if-no-files-found: warn

